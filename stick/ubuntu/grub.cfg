# Unattended: the default entry after 3 seconds. Kernel lockdown applies under Secure Boot (see README).
set timeout=3
set default=0
search --set=root --file /.disk/info
menuentry "rigsim hardware stick (measure, then power off)" {
    linux /casper/vmlinuz boot=casper noprompt noeject loglevel=3 quiet splash=off modprobe.blacklist=nouveau nouveau.modeset=0 ---
    initrd /casper/initrd
}
menuentry "rigsim hardware stick (measure, stay on)" {
    linux /casper/vmlinuz boot=casper noprompt noeject loglevel=3 modprobe.blacklist=nouveau nouveau.modeset=0 rigsim.nopoweroff ---
    initrd /casper/initrd
}
menuentry "shell only (nothing measured)" {
    linux /casper/vmlinuz boot=casper noprompt noeject loglevel=3 modprobe.blacklist=nouveau systemd.mask=rigsim-stick.service ---
    initrd /casper/initrd
}
