question = "cpu-mem-latency"
asks = "Idle latency by working-set size, 1 MiB (caches) to 4 GiB (RAM), one thread pinned to the fastest core and on hybrid Intel parts also to an E-core, with the core's clock during the measurement (stick profile: the machine's own clock settings)."
feeds = "RAM access time: CAS time + the global fixed term (hw/arch.py, constants.FIXED_LATENCY_NS)."
image = "debian:trixie"
toolkit = "cpu"
gpus = "none"
exclusive = true
repeats = 3
timeout_s = 300

[grid]
mib = [1, 16, 64, 1024, 4096]   # 1 and 16 MiB: in the caches, to separate cache from DRAM latency

[args]
passes = 5
cmd = ["cpuprobe", "latency", "--mib", "{mib}", "--passes", "{passes}"]
