name: Submit runs
description: Share runs from a rigsim stick — drop a .zip or .tar.gz, no git needed
title: "Runs: "
labels: ["runs-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Pack the run folders from the stick's `runs/` folder into a **.zip** or **.tar.gz** (several archives are
        fine too) and drop it into the field below. GitHub does not accept .tar.xz, .7z or .rar here —
        on Linux: `tar -czf runs.tar.gz <run folders>`, on Windows: right-click → *Compress to ZIP file*. A check runs right away: the runs must come unchanged from a stick and be complete.
        Valid runs become a pull request, linked here; the result of the check is posted as a comment. If
        something needs fixing, edit this issue (e.g. drop a new zip) and the check runs again.
  - type: textarea
    id: zip
    attributes:
      label: Archive with the runs
      description: Drag the .zip or .tar.gz here (up to 25 MB per file on GitHub; several files are fine).
      placeholder: Drop the archive here…
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      options:
        - label: I agree that the runs are published under CC BY 4.0
          required: true
        - label: The owner of every measured machine agreed to publication
          required: true
        - label: The run folders are unchanged from the stick
          required: true
  - type: checkboxes
    id: attribution
    attributes:
      label: Your name on the results
      description: >-
        By default the runs are credited to your GitHub username on the results page, with a link to your profile.
        Git history and this issue show who submitted them either way.
      options:
        - label: Keep my username out of the stored result data and do not display it on the results page
  - type: input
    id: machines
    attributes:
      label: Machines (optional)
      description: e.g. "my desktop, a friend's laptop"
