name: Tests
on: [push, pull_request]
jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest
      # the CPU probes are compiled and run by the tests; fio runs read-only against a temp file
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends gcc libopenblas-dev libdnnl-dev fio
      - run: python -m pytest -q stick/tests tests
