# rigsim's predictions for every run, once a day: the newest rigsim engine release (vX.Y.Z) predicts the runs it
# has not predicted yet (tools/predict.py, contract in predictions/README.md); earlier releases' files stay.
name: predictions
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: predictions
jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/predict.py
      - run: python3 tools/index.py
      - name: Commit new predictions and the table
        run: |
          git add predictions docs/data.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(predictions): $(git diff --cached --name-only predictions | wc -l) new file(s)"
          git push
          # a push with the workflow token starts no other workflow — not even the Pages deployment: ask for it
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null && echo "Pages build requested"
        env:
          GH_TOKEN: ${{ github.token }}
