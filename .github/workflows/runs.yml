# Contributed runs: checked on every pull request that adds run folders or credits; after merging, the table is
# rebuilt.
name: Contributed runs
on:
  pull_request:
    # only contributions: run folders and their credits. Maintenance (code, docs, results/FORMAT.md) is not one.
    paths: ["results/runs/**", "results/attribution/**"]
  push:
    branches: [main]
    paths: ["results/runs/**", "results/attribution/**"]
jobs:
  validate:
    name: Validate contributed runs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, issues: read, pull-requests: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Only new run folders, exact stick format, complete, nothing identifying
        env:
          GH_TOKEN: ${{ github.token }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          # a credit may only name the contributor: the pull request's author — or, for a pull request the submission
          # pipeline opened from an issue (branch submission/issue-<n>, author github-actions[bot]), that issue's author
          PR_AUTHOR="$PR_USER"
          if [[ "$PR_USER" == "github-actions[bot]" && "$HEAD" =~ ^submission/issue-([0-9]+)$ ]]; then
            PR_AUTHOR="$(gh api "repos/${{ github.repository }}/issues/${BASH_REMATCH[1]}" -q .user.login)"
          fi
          export PR_AUTHOR
          python3 tools/validate.py --pr "origin/${{ github.base_ref }}"
  table:
    name: Rebuild results table
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: write, pages: write, checks: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/index.py
      - name: Commit the rebuilt table
        run: |
          git diff --quiet docs/data.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(table): rebuilt from results/runs" docs/data.json
          .github/scripts/push-checked.sh main
          # a push with the workflow token starts no other workflow — not even the Pages deployment: ask for it
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null && echo "Pages build requested"
        env:
          GH_TOKEN: ${{ github.token }}
