# Every commit pushed or proposed must follow Conventional Commits (.github/scripts/check-commits.py).
name: Commit messages
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  conventional:
    name: Check Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check commit messages
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then range="$BASE..$HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then range="$AFTER^!"
          else range="$BEFORE..$AFTER"; fi
          python3 .github/scripts/check-commits.py "$range"
